<div class="form-grid span-12" data-purchase-draft hidden><label class="span-6">Fornecedor<input name="supplier" required></label><label class="span-6">Data da compra<input type="date" name="purchase_date" required></label><label class="span-6">Forma de pagamento<select name="payment_method">{% for method in payment_methods %}<option value="{{ method.pk }}">{{ method.name }}</option>{% endfor %}</select></label><label class="span-3">Parcelas<input name="installments" type="number" min="1" required></label><label class="span-3">Primeiro vencimento<input type="date" name="first_due_date" required></label></div>
