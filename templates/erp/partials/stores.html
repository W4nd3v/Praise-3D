<section class="card" style="margin-top:16px"><div class="card-head"><h2>Estabelecimentos consignados</h2></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Loja</th><th>Contato</th><th>Telefone</th><th>Comissão padrão</th><th></th></tr></thead><tbody>{% for store in stores %}<tr><td>{{ store.name }}</td><td>{{ store.contact_name }}</td><td>{{ store.phone }}</td><td>{{ store.default_commission_percent }}%</td><td><button type="button" class="button small edit-store" data-dialog="store-dialog" data-id="{{ store.pk }}" data-name="{{ store.name }}" data-contact="{{ store.contact_name }}" data-phone="{{ store.phone }}" data-address="{{ store.address }}" data-commission="{{ store.default_commission_percent }}" data-notes="{{ store.notes }}">Editar</button></td></tr>{% endfor %}</tbody></table></div></section>
