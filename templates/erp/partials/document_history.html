<section class="card" style="margin-top:18px"><div class="card-head"><h2>PDFs emitidos · histórico imutável</h2></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Emissão</th><th>Documento</th><th>Versão</th><th></th></tr></thead><tbody>{% for document in issued_documents %}<tr><td>{{ document.created_at|date:'d/m/Y H:i' }}</td><td>{{ document.filename }}</td><td>#{{ document.pk }}</td><td><a class="button small ghost" href="{% url 'issued_document_pdf' document.pk %}" target="_blank">Abrir original</a></td></tr>{% empty %}<tr><td colspan="4" class="empty">Nenhum PDF emitido.</td></tr>{% endfor %}</tbody></table></div></section>
